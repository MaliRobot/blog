[project]
name = "blog"
version = "0.1.0"
description = "A Django blog project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.17",
    "django-environ==0.11.2",
    "python-decouple==3.8",
    "psycopg2-binary==2.9.9",
    "mysqlclient==2.2.4",
    "django-admin-interface==0.28.6",
    "django-colorfield==0.11.0",
    "django-ckeditor==6.7.1",
    "djangorestframework==3.17.2",
    "django-cors-headers==4.3.0",
    "django-allauth",
    "Pillow==10.3.0",
    "django-imagekit==5.0.0",
    "django-extensions==3.2.3",
    "django-taggit==5.0.1",
    "django-leaflet==0.34.0",
    "django-location-field==2.7.3",
    "django-recaptcha==4.0.0",
    "django-meta==2.4.2",
    "django-social-share==2.3.0",
    "django-redis==5.4.0",
    "redis==5.0.1",
    "hiredis==2.2.3",
    "celery==5.3.4",
    "pytz==2023.3.post1",
    "python-dotenv==1.0.0",
    "gunicorn==22.0.0",
    "whitenoise==6.6.0",
    "dj-database-url==2.1.0",
    "psycopg2==2.9.9",
    "django-storages==1.14.2",
    "boto3==1.29.7",
    "sentry-sdk==1.38.0",
    "django-prometheus==2.3.1",
    "django-csp==3.7",
    "django-ratelimit==4.1.0",
    "django-cachalot",
    "django-compressor==4.4",
    "django-appconf==1.0.6",
    "django-autoslug==1.9.9",
    "django-filter==24.2",
    "django-flat-responsive==2.0",
    "django-flat-theme==1.1.4",
    "django-geojson==4.0.0",
    "django-js-asset==2.2.0",
    "dnspython==2.6.1",
    "importlib-metadata==7.1.0",
    "jsonfield==3.1.0",
    "Markdown==3.6.0",
    "mysql-connector-python==8.3.0",
    "pilkit==3.0",
    "protobuf==5.29.6",
    "PyMySQL==1.1.0",
    "six==1.16.0",
    "sqlparse==0.6.0",
    "tqdm==4.66.2",
    "zipp==3.18.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==4.3.0",
    "ipython==8.17.2",
    "ipdb==0.13.13",
    "pytest==7.4.3",
    "pytest-django==4.7.0",
    "pytest-cov==4.1.0",
    "factory-boy==3.3.0",
    "faker==20.1.0",
    "flake8==6.1.0",
    "black==23.11.0",
    "isort==5.12.0",
    "pylint==3.0.2",
    "pre-commit==3.5.0",
    "sphinx==7.2.6",
    "sphinx-rtd-theme==2.0.0",
    "werkzeug==3.1.6",
    "django-livereload-server==0.4",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_django = ["django"]
known_first_party = ["apps", "config"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*", "*/venv/*", "*/env/*"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0901",  # too-many-ancestors
    "W0622",  # redefined-builtin
    "W1203",  # logging-fstring-interpolation
]

[tool.pylint.master]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings.development"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--no-migrations",
    "--reuse-db",
]
testpaths = ["tests", "apps"]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = [
    "apps.*.migrations*",
]
