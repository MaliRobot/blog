version: '3'

services:
  mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    command:
      --init-file /data/application/init.sql
    restart: always
    volumes:
      - ./volumes/init.sql:/data/application/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_SSL_MODE: "disabled"
