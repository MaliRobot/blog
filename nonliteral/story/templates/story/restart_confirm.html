<!-- story/templates/story/restart_confirm.html -->
{% extends 'story/base.html' %}

{% block title %}Restart Story - Story Adventure{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body text-center py-4">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <h3>Restart Your Adventure?</h3>
                    <p>This will reset all your progress and stats back to the beginning.</p>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-redo"></i> Yes, Restart
                        </button>
                        <a href="{% url 'story:dashboard' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
